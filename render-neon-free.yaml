services:
  - type: web
    name: studyquest-sync
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STUDYQUEST_ADMIN_PASSWORD
        sync: false
      - key: STUDYQUEST_INVITE_CODE
        sync: false
      - key: STUDYQUEST_ADMIN_CONTACT_LABEL
        sync: false
      - key: STUDYQUEST_ADMIN_CONTACT_URL
        sync: false
      - key: STUDYQUEST_MAX_ACCOUNTS
        value: "5"
      - key: STUDYQUEST_V14_ACCESS
        value: "all"
      - key: STUDYQUEST_V15_ACCESS
        value: "off"
      - key: STUDYQUEST_V16_ACCESS
        value: "off"
      - key: STUDYQUEST_MAX_STATE_BYTES
        value: "10485760"
      - key: STUDYQUEST_MAX_STATE_ENVELOPE_BYTES
        value: "262144"
      - key: STUDYQUEST_STATE_HISTORY_BUDGET_BYTES
        value: "67108864"
      - key: PGSSLMODE
        value: require
