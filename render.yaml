# Short-term/test blueprint only.
# Render Free Postgres expires after 30 days. For no-monthly-cost long-term use,
# prefer render-neon-free.yaml with a Neon Free Postgres DATABASE_URL.
services:
  - type: web
    name: studyquest-sync
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studyquest-db
          property: connectionString
      - key: STUDYQUEST_ADMIN_PASSWORD
        sync: false
      - key: STUDYQUEST_INVITE_CODE
        sync: false
      - key: STUDYQUEST_ADMIN_CONTACT_LABEL
        sync: false
      - key: STUDYQUEST_ADMIN_CONTACT_URL
        sync: false
      - key: STUDYQUEST_MAX_ACCOUNTS
        value: "5"
      - key: STUDYQUEST_MAX_STATE_BYTES
        value: "1048576"
      - key: PGSSLMODE
        value: require

databases:
  - name: studyquest-db
    databaseName: studyquest
    plan: free
    postgresMajorVersion: "17"
